name: Release and Publish Java 8 LTS Distribution

on:
  push:
    tags:
      - 'v5.16.8.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and Install Consumed Modules (JDK 8)
        run: |
          mvn clean install -Dmaven.build.cache.enabled=false -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true \
            -pl activemq-client,activemq-openwire-legacy,activemq-broker,activemq-kahadb-store,activemq-spring,activemq-jms-pool,activemq-pool,activemq-jaas -am

      - name: Run Targeted Security Verification Tests
        run: |
          mvn test -Dmaven.build.cache.enabled=false -B -ntp -pl activemq-client,activemq-broker,activemq-spring -DfailIfNoTests=false \
            -Dtest=FactoryFinderTest,WireFormatInfoTest,MarshallingSupportTest,FrameSizeLimitedFilterInputStreamTest,ClassLoadingAwareObjectInputStreamTest,ActiveMQConnectionMetaDataTest,LdapNetworkConnectorTest,UtilsTest,XBeanBrokerFactoryTest

      - name: Verify JDK 8 Bytecode Compatibility (major <= 52)
        run: |
          for cls in \
            activemq-broker/target/classes/org/apache/activemq/broker/BrokerService.class \
            activemq-broker/target/classes/org/apache/activemq/transport/vm/VMTransportFactory.class \
            activemq-spring/target/classes/org/apache/activemq/xbean/XBeanBrokerFactory.class \
            activemq-client/target/classes/org/apache/activemq/command/WireFormatInfo.class \
            activemq-client/target/classes/org/apache/activemq/transport/FrameSizeLimitedFilterInputStream.class; do
            MAJOR=$(javap -v "$cls" | awk '/major version:/ {print $3; exit}')
            echo "$cls major version: $MAJOR"
            test -n "$MAJOR" && test "$MAJOR" -le 52
          done

      - name: Deploy Consumed Modules to GitHub Packages
        run: |
          mvn deploy -Dmaven.build.cache.enabled=false -B -ntp -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true \
            -pl activemq-client,activemq-openwire-legacy,activemq-broker,activemq-kahadb-store,activemq-spring,activemq-jms-pool,activemq-pool,activemq-jaas -am

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
